<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>神经网络入门互动演示</title>
  <style>
    :root {
      --paper: #f6f4ee;
      --ink: #202124;
      --muted: #62665d;
      --line: #d7d1c3;
      --white: #ffffff;
      --teal: #0f766e;
      --amber: #b86f14;
      --blue: #315caa;
      --rose: #a83e51;
      --soft-teal: #e2f1ef;
      --soft-amber: #f5e5cf;
      --soft-blue: #e7edf9;
      --soft-rose: #f6e2e7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }

    header,
    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    header {
      padding: 24px 0 18px;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    .nav a,
    button {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 12px;
      background: var(--white);
      color: var(--ink);
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    button.active {
      color: var(--white);
      background: var(--teal);
      border-color: var(--teal);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.1;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.75;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(320px, 0.95fr);
      gap: 16px;
      padding-bottom: 34px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
      overflow: hidden;
    }

    .panel-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: #fbfaf5;
    }

    .panel-head h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
    }

    .panel-body {
      padding: 16px;
    }

    .stage {
      min-height: 390px;
      display: grid;
      grid-template-columns: 150px 1fr 150px;
      gap: 10px;
      align-items: center;
      position: relative;
    }

    .stack {
      display: grid;
      gap: 18px;
      justify-items: center;
    }

    .node {
      width: 92px;
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--white);
      font-weight: 800;
      box-shadow: 0 12px 24px rgba(32, 33, 36, 0.14);
    }

    .node.input { background: var(--blue); }
    .node.neuron { background: var(--amber); }
    .node.output { background: var(--rose); }

    .formula {
      align-self: stretch;
      display: grid;
      align-content: center;
      gap: 12px;
    }

    .wire {
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--blue), var(--amber), var(--rose));
      opacity: 0.74;
    }

    .score {
      border-radius: 8px;
      padding: 12px;
      background: #f3f0e8;
      line-height: 1.7;
      font-family: Consolas, "Courier New", monospace;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .answer {
      display: grid;
      gap: 8px;
      justify-items: center;
    }

    .big-number {
      font-size: clamp(34px, 6vw, 62px);
      font-weight: 900;
      color: var(--rose);
      letter-spacing: 0;
    }

    .controls {
      display: grid;
      gap: 14px;
    }

    .control {
      display: grid;
      grid-template-columns: 88px 1fr 58px;
      gap: 10px;
      align-items: center;
    }

    label {
      font-weight: 700;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--teal);
    }

    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .truth {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .case {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fffdf8;
      min-height: 100px;
    }

    .case strong {
      display: block;
      margin-bottom: 6px;
    }

    .ok {
      color: var(--teal);
      font-weight: 800;
    }

    .bad {
      color: var(--rose);
      font-weight: 800;
    }

    .why {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 16px;
    }

    .mini {
      border-radius: 8px;
      padding: 12px;
      min-height: 130px;
      line-height: 1.65;
    }

    .mini:nth-child(1) { background: var(--soft-blue); }
    .mini:nth-child(2) { background: var(--soft-amber); }
    .mini:nth-child(3) { background: var(--soft-teal); }

    .mini h3 {
      margin: 0 0 8px;
      font-size: 16px;
      letter-spacing: 0;
    }

    @media (max-width: 940px) {
      main,
      .why {
        grid-template-columns: 1fr;
      }

      .stage {
        grid-template-columns: 1fr;
      }

      .wire {
        height: 8px;
      }

      .truth {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <header>
    <nav class="nav" aria-label="页面导航">
      <a href="../README.md">主题说明</a>
      <a href="../code-flow.html">代码流程</a>
      <a href="directional-derivative.html">方向导数</a>
      <a href="../slides.html">PPT 讲义</a>
      <a href="../logic-map.html">逻辑图</a>
      <a href="../demo-project/mlp_from_scratch.py">源码</a>
    </nav>
    <h1>拖一拖权重，看神经元怎么变答案</h1>
    <p>神经元像一个会调旋钮的小计算器：输入乘权重，加上偏置，再经过激活函数，最后变成 0 到 1 的分数。</p>
  </header>

  <main>
    <section class="panel">
      <div class="panel-head">
        <h2>单个神经元操作台</h2>
      </div>
      <div class="panel-body">
        <div class="stage">
          <div class="stack">
            <div class="node input">输入 A</div>
            <div class="node input">输入 B</div>
          </div>
          <div class="formula">
            <div class="wire"></div>
            <div class="score" id="formulaText"></div>
            <div class="wire"></div>
          </div>
          <div class="answer">
            <div class="node output">输出</div>
            <div class="big-number" id="outputNumber">0.00</div>
            <p id="outputLabel">判断：0</p>
          </div>
        </div>

        <div class="why">
          <article class="mini">
            <h3>权重</h3>
            <p>白话：模型更看重哪个输入。权重大，这个输入说话声音就大。</p>
          </article>
          <article class="mini">
            <h3>偏置</h3>
            <p>白话：神经元的基础倾向。就算输入都很小，它也可能偏向开或关。</p>
          </article>
          <article class="mini">
            <h3>激活函数</h3>
            <p>白话：把原始分数压成 0 到 1，像把模糊判断变成概率感。</p>
          </article>
        </div>
      </div>
    </section>

    <aside class="panel">
      <div class="panel-head">
        <h2>调参数</h2>
      </div>
      <div class="panel-body">
        <div class="presets">
          <button data-preset="and">与门</button>
          <button data-preset="or" class="active">或门</button>
          <button data-preset="half-xor">异或的一半</button>
        </div>

        <div class="controls">
          <div class="control">
            <label for="inputA">输入 A</label>
            <input id="inputA" type="range" min="0" max="1" step="1" value="0" />
            <span id="inputAValue">0</span>
          </div>
          <div class="control">
            <label for="inputB">输入 B</label>
            <input id="inputB" type="range" min="0" max="1" step="1" value="1" />
            <span id="inputBValue">1</span>
          </div>
          <div class="control">
            <label for="weightA">权重 A</label>
            <input id="weightA" type="range" min="-8" max="8" step="0.1" value="6" />
            <span id="weightAValue">6.0</span>
          </div>
          <div class="control">
            <label for="weightB">权重 B</label>
            <input id="weightB" type="range" min="-8" max="8" step="0.1" value="6" />
            <span id="weightBValue">6.0</span>
          </div>
          <div class="control">
            <label for="bias">偏置</label>
            <input id="bias" type="range" min="-10" max="4" step="0.1" value="-3" />
            <span id="biasValue">-3.0</span>
          </div>
        </div>

        <div class="truth" id="truthTable" aria-label="四种输入的判断结果"></div>
      </div>
    </aside>
  </main>

  <script>
    const controls = {
      inputA: document.querySelector("#inputA"),
      inputB: document.querySelector("#inputB"),
      weightA: document.querySelector("#weightA"),
      weightB: document.querySelector("#weightB"),
      bias: document.querySelector("#bias")
    };

    const values = {
      inputA: document.querySelector("#inputAValue"),
      inputB: document.querySelector("#inputBValue"),
      weightA: document.querySelector("#weightAValue"),
      weightB: document.querySelector("#weightBValue"),
      bias: document.querySelector("#biasValue")
    };

    const formulaText = document.querySelector("#formulaText");
    const outputNumber = document.querySelector("#outputNumber");
    const outputLabel = document.querySelector("#outputLabel");
    const truthTable = document.querySelector("#truthTable");
    const presetButtons = document.querySelectorAll("[data-preset]");

    const presets = {
      and: { weightA: 6, weightB: 6, bias: -9 },
      or: { weightA: 6, weightB: 6, bias: -3 },
      "half-xor": { weightA: 8, weightB: -8, bias: -4 }
    };

    function sigmoid(score) {
      return 1 / (1 + Math.exp(-score));
    }

    function readNumber(name) {
      return Number(controls[name].value);
    }

    function predict(inputA, inputB) {
      const weightA = readNumber("weightA");
      const weightB = readNumber("weightB");
      const bias = readNumber("bias");
      const raw = inputA * weightA + inputB * weightB + bias;
      const output = sigmoid(raw);
      return { raw, output, answer: output >= 0.5 ? 1 : 0 };
    }

    function updateLabels() {
      for (const name of Object.keys(controls)) {
        const number = readNumber(name);
        values[name].textContent = name.startsWith("input")
          ? String(number)
          : number.toFixed(1);
      }
    }

    function renderTruthTable() {
      const cases = [
        { inputA: 0, inputB: 0, target: 0 },
        { inputA: 0, inputB: 1, target: 1 },
        { inputA: 1, inputB: 0, target: 1 },
        { inputA: 1, inputB: 1, target: 0 }
      ];

      truthTable.innerHTML = cases.map((item) => {
        const result = predict(item.inputA, item.inputB);
        const matched = result.answer === item.target;
        return `
          <article class="case">
            <strong>${item.inputA}, ${item.inputB}</strong>
            <div>异或目标：${item.target}</div>
            <div>当前判断：${result.answer}</div>
            <div class="${matched ? "ok" : "bad"}">${matched ? "对上" : "没对上"}</div>
          </article>
        `;
      }).join("");
    }

    function render() {
      updateLabels();

      const inputA = readNumber("inputA");
      const inputB = readNumber("inputB");
      const result = predict(inputA, inputB);

      formulaText.textContent =
        `${inputA} * ${readNumber("weightA").toFixed(1)} + ` +
        `${inputB} * ${readNumber("weightB").toFixed(1)} + ` +
        `${readNumber("bias").toFixed(1)} = ${result.raw.toFixed(2)}，` +
        `激活后 = ${result.output.toFixed(4)}`;

      outputNumber.textContent = result.output.toFixed(2);
      outputLabel.textContent = `判断：${result.answer}`;
      renderTruthTable();
    }

    for (const control of Object.values(controls)) {
      control.addEventListener("input", render);
    }

    for (const button of presetButtons) {
      button.addEventListener("click", () => {
        const preset = presets[button.dataset.preset];
        controls.weightA.value = preset.weightA;
        controls.weightB.value = preset.weightB;
        controls.bias.value = preset.bias;
        presetButtons.forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
        render();
      });
    }

    render();
  </script>
</body>
</html>
